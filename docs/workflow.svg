<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" role="img" aria-labelledby="title desc"><title id="title">Compose an image prompt</title><desc id="desc">Workflow diagram: Choose a subject then Select attributes then Copy the prompt.</desc><rect width="960" height="270" rx="12" fill="#f6f3ec"/><text x="30" y="44" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" fill="#222">Compose an image prompt</text><rect x="30" y="78" width="280" height="150" rx="8" fill="#fff" stroke="#d5d1c8"/><rect x="30" y="78" width="280" height="6" rx="3" fill="#553158"/><text x="48" y="122" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#222">Choose a subject</text><text x="48" y="161" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#424242">Write the main subject</text><text x="48" y="188" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#424242">Start with what to depict</text><path d="M318 153h13m-5-5 5 5-5 5" fill="none" stroke="#553158" stroke-width="2"/><rect x="340" y="78" width="280" height="150" rx="8" fill="#fff" stroke="#d5d1c8"/><rect x="340" y="78" width="280" height="6" rx="3" fill="#553158"/><text x="358" y="122" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#222">Select attributes</text><text x="358" y="161" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#424242">Style, light, mood, material</text><text x="358" y="188" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#424242">Definitions from words.json</text><path d="M628 153h13m-5-5 5 5-5 5" fill="none" stroke="#553158" stroke-width="2"/><rect x="650" y="78" width="280" height="150" rx="8" fill="#fff" stroke="#d5d1c8"/><rect x="650" y="78" width="280" height="6" rx="3" fill="#553158"/><text x="668" y="122" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#222">Copy the prompt</text><text x="668" y="161" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#424242">Assemble selected terms</text><text x="668" y="188" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#424242">Browser remembers selections</text></svg>
